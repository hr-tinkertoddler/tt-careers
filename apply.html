<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join Tinker Toddler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E3B2C; --paper:#FFFFFF; --sky:#E4F3E2; --sun:#9ED67A; --leaf:#2F8F4E;
  --line:#D3E2D5; --muted:#5A6E60; --err:#C2413A; --soft:#F4F9F3;
  --cjk:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --display:"Baloo 2",var(--cjk);
  --body:"Nunito Sans",var(--cjk);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.55 var(--body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:540px;margin:0 auto;padding:20px 20px 120px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:700 18px/1 var(--display);letter-spacing:.2px}
.lang{display:flex;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;font:600 13px var(--body);color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

h1{font:700 clamp(30px,8vw,38px)/1.1 var(--display);margin:28px 0 8px}
.intro{color:var(--muted);margin:0 0 22px;max-width:44ch}

/* footprint trail */
.trail{display:flex;align-items:flex-end;gap:6px;height:54px;margin:4px 0 6px}
.trail svg{width:20px;height:30px;fill:var(--line);transition:fill .2s}
.trail svg:nth-child(odd){transform:translateY(-14px) rotate(-8deg)}
.trail svg:nth-child(even){transform:scaleX(-1) rotate(-8deg)}
.trail svg.done{fill:var(--ink)}
.trail svg.now{fill:var(--sun);stroke:var(--ink);stroke-width:1.5}
.trail svg.stamp{animation:stamp .35s ease-out}
@keyframes stamp{0%{scale:1.5}100%{scale:1}}
.steplabel{font:600 13px var(--body);color:var(--muted);margin-bottom:18px}

.card{background:var(--paper);border-radius:18px;padding:22px 20px;border:1.5px solid var(--line)}
h2{font:700 24px/1.2 var(--display);margin:0 0 16px}

.field{margin-bottom:18px}
.field > label, .field > .lbl{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.req::after{content:" *";color:var(--err)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],select,textarea{
  width:100%;font:16px var(--body);color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;appearance:none}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--sky)}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
.error{font-size:13px;color:var(--err);margin-top:5px;font-weight:600}
.invalid input,.invalid select,.invalid textarea,.invalid .chips{border-color:var(--err)}

.chips{display:flex;flex-wrap:wrap;gap:8px;border:1.5px solid transparent;border-radius:12px}
.chips label{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;
  padding:9px 14px;cursor:pointer;font-weight:600;font-size:15px;background:var(--paper)}
.chips input{accent-color:var(--ink);width:17px;height:17px;margin:0}
.chips label:has(input:checked){border-color:var(--ink);background:var(--sky)}

.toggle{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;background:var(--sky);font-weight:700;cursor:pointer;margin-bottom:18px}
.toggle input{width:20px;height:20px;accent-color:var(--ink);margin:0}

/* jobs */
.jobs{display:grid;gap:10px}
.job{display:block;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;
  padding:16px;cursor:pointer;font:inherit;color:inherit}
.job[aria-pressed="true"]{border-color:var(--ink);background:var(--sky);box-shadow:inset 4px 0 0 var(--ink)}
.job strong{display:block;font:700 18px/1.25 var(--display)}
.job .loc{font-size:14px;color:var(--muted);font-weight:600}
.job p{margin:6px 0 0;font-size:14px}

/* photo + docs */
.selfie{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.face{width:190px;height:190px;border-radius:50%;background:var(--sky);border:3px dashed var(--line);
  display:grid;place-items:center;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover}
.face svg{width:70px;opacity:.5}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc{position:relative;border:1.5px dashed var(--line);border-radius:14px;min-height:130px;padding:12px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:4px;cursor:pointer;background:var(--soft);overflow:hidden}
.doc.wide{grid-column:1/-1}
.doc.has{border-style:solid;border-color:var(--leaf);background:var(--paper)}
.doc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.doc .t{position:relative;font-weight:700;font-size:15px}
.doc .s{position:relative;font-size:13px;color:var(--muted);word-break:break-all}
.doc.has .s{color:var(--leaf);font-weight:700}
.doc input{position:absolute;inset:0;opacity:0;cursor:pointer}
.doc.invalid{border-color:var(--err)}
.doc.off{opacity:.45;pointer-events:none}

/* review */
dl.review{margin:0 0 18px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
dl.review dt{color:var(--muted)}
dl.review dd{margin:0;font-weight:600;word-break:break-word}
.consent{font-size:14px;line-height:1.5}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1.5px solid var(--line);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:540px;margin:0 auto;display:flex;gap:10px}
.btn{font:700 17px var(--body);border-radius:14px;padding:14px 18px;border:0;cursor:pointer}
.btn.primary{flex:1;background:var(--sun);color:var(--ink)}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{font-size:15px;padding:10px 16px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.job:focus-visible,.lang button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.overlay{position:fixed;inset:0;background:rgba(30,59,44,.55);display:none;place-items:center;z-index:9;padding:20px}
.overlay.on{display:grid}
.overlay .box{background:var(--paper);border-radius:18px;padding:26px;text-align:center;max-width:320px;font-weight:700}
.spin{width:38px;height:38px;border:4px solid var(--sky);border-top-color:var(--ink);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.done{text-align:center;padding:40px 10px}
.done h2{font-size:30px}
.ref{display:inline-block;font:700 22px var(--display);background:var(--sky);padding:8px 18px;border-radius:12px;margin:8px 0 16px}
.avail{display:grid;grid-template-columns:40px repeat(3,1fr);gap:6px;border:1.5px solid transparent;border-radius:12px}
.avail .h{font-size:13px;font-weight:700;color:var(--muted);text-align:center;align-self:end}
.avail .d{font-weight:700;display:flex;align-items:center}
.avail button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;height:42px;font:700 16px var(--body);color:var(--ink);cursor:pointer}
.avail button[aria-pressed="true"]{background:var(--sun);border-color:var(--ink)}
.invalid .avail{border-color:var(--err)}
.hp{position:absolute;left:-9999px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  {k:'icBack',accept:'image/*'},
  {k:'resume',accept:'image/*,application/pdf',wide:1},
  {k:'payslip',accept:'image/*,application/pdf',wide:1}
];

const S = { lang:'zh', step:0, jobs:null, jobsErr:false, data:{}, files:{}, errors:{}, consent:false };
const $ = id => document.getElementById(id);
const t = k => (T[k] ? T[k][S.lang] : k);
const isFreelance = () => /^FREELANCE/i.test(S.data.jobId || '');
const lbl = k => t(k === 'expectedSalary' && isFreelance() ? 'expectedDaily' : k);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- language ---------- */
function initLang(){
  let saved = null; try { saved = localStorage.getItem('tt-lang'); } catch(e){}
  const nav = (navigator.language || '').toLowerCase();
  S.lang = saved || (nav.startsWith('zh') ? 'zh' : nav.startsWith('ms') ? 'ms' : 'en');
  document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
    S.lang = b.dataset.lang; try { localStorage.setItem('tt-lang', S.lang); } catch(e){}
    render();
  });
}

/* ---------- render ---------- */
function render(stampIdx){
  document.documentElement.lang = {zh:'zh-Hant',en:'en',ms:'ms'}[S.lang];
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === S.lang));
  $('title').textContent = t('title');
  $('intro').textContent = t('intro');
  const names = t('steps');
  $('trail').innerHTML = names.map((_, i) =>
    FOOT.replace('<svg', `<svg class="${i < S.step ? 'done' : i === S.step ? 'now' : ''}${i === stampIdx ? ' stamp' : ''}"`)).join('');
  $('steplabel').textContent = T.stepOf[S.lang](S.step + 1, names.length);
  $('backBtn').textContent = t('back');
  $('backBtn').hidden = S.step === 0;
  $('nextBtn').textContent = S.step === 5 ? t('submit') : t('next');
  $('card').innerHTML = `<h2>${esc(names[S.step])}</h2>` + [stepJob, stepFields, stepFields, stepSelfie, stepDocs, stepReview][S.step]();
  bind();
}

function stepJob(){
  if (S.jobsErr) return `<p class="error">${t('jobsError')}</p>`;
  if (!S.jobs) return `<p class="hint">${t('loadingJobs')}</p>`;
  if (!S.jobs.length) return `<p>${t('noJobs')}</p>`;
  const L = S.lang === 'zh' ? ['zh','descZh'] : S.lang === 'ms' ? ['ms','descMs'] : ['en','descEn'];
  return `<div class="jobs">` + S.jobs.map(j => `
    <button type="button" class="job" data-job="${esc(j.id)}" aria-pressed="${S.data.jobId === j.id}">
      <strong>${esc(j[L[0]] || j.en || j.zh)}</strong>
      ${j.location ? `<span class="loc">${esc(j.location)}</span>` : ''}
      ${(j[L[1]] || j.descEn) ? `<p>${esc(j[L[1]] || j.descEn)}</p>` : ''}
    </button>`).join('') + `</div>` + (S.errors.jobId ? `<p class="error">${t('pickJob')}</p>` : '') + freelanceBlock();
}

function freelanceBlock(){
  if (!isFreelance()) return '';
  const v = S.data.freelanceTasks || [];
  const e1 = S.errors.freelanceTasks, e2 = S.errors.freelanceOther;
  return `<div class="field ${e1 ? 'invalid' : ''}" style="margin-top:22px"><span class="lbl req">${t('freelanceWork')}</span>
    <div class="chips">${['fw_counter','fw_delivery','fw_other'].map(o => `<label><input type="checkbox" name="freelanceTasks" value="${o}" ${v.includes(o) ? 'checked' : ''}> ${t(o)}</label>`).join('')}</div>
    ${e1 ? `<div class="error">${t(e1)}</div>` : ''}</div>
    ${v.includes('fw_other') ? `<div class="field ${e2 ? 'invalid' : ''}"><input id="f_freelanceOther" name="freelanceOther" type="text" placeholder="${t('fwOtherPh')}" value="${esc(S.data.freelanceOther)}">${e2 ? `<div class="error">${t(e2)}</div>` : ''}</div>` : ''}
    ${availBlock()}`;
}

function availBlock(){
  const a = S.data.avail || [], e = S.errors.avail;
  const days = t('days'), slots = t('slots');
  return `<div class="field ${e ? 'invalid' : ''}"><span class="lbl req">${t('avail')}</span>
    <div class="hint" style="margin:-2px 0 10px">${t('availHint')}</div>
    <div class="avail"><span></span>${slots.map(s => `<span class="h">${s}</span>`).join('')}
      ${days.map((d, i) => `<span class="d">${d.replace('週', '')}</span>` + slots.map((s, j) => {
        const k = i + '-' + j, on = a.includes(k);
        return `<button type="button" data-slot="${k}" aria-pressed="${on}" aria-label="${d} ${s}">${on ? '✓' : ''}</button>`;
      }).join('')).join('')}
    </div>${e ? `<div class="error">${t(e)}</div>` : ''}</div>`;
}
function availText(lang){
  const a = S.data.avail || [], D = T.days[lang], SL = T.slots[lang];
  return D.map((d, i) => {
    const s = [0, 1, 2].filter(j => a.includes(i + '-' + j)).map(j => SL[j]);
    return s.length ? d + ' ' + s.join('/') : '';
  }).filter(Boolean).join(', ');
}

function stepFields(){
  const list = FIELDS[S.step];
  let html = '';
  if (S.step === 2) html += `<label class="toggle"><input type="checkbox" id="noPrevJob" ${S.data.noPrevJob ? 'checked' : ''}> ${t('noPrevJob')}</label>`;
  list.forEach(f => {
    if (S.step === 2 && S.data.noPrevJob && (f.req === 'job' || f.jobOnly)) return;
    const req = f.req === 1 || (f.req === 'job' && !S.data.noPrevJob);
    const v = S.data[f.k] ?? '';
    const err = S.errors[f.k];
    let ctrl;
    if (f.type === 'radio' || f.type === 'check') {
      const arr = f.type === 'check' ? (v || []) : [v];
      ctrl = `<div class="chips">` + f.opts.map(o => `<label><input type="${f.type === 'check' ? 'checkbox' : 'radio'}" name="${f.k}" value="${o}" ${arr.includes(o) ? 'checked' : ''}> ${t(o)}</label>`).join('') + `</div>`;
      html += `<div class="field ${err ? 'invalid' : ''}"><span class="lbl ${req ? 'req' : ''}">${lbl(f.k)}</span>${ctrl}`;
    } else {
      if (f.type === 'select') ctrl = `<select id="f_${f.k}" name="${f.k}"><option value="">${t('choose')}</option>` + f.opts.map(o => `<option value="${o}" ${v === o ? 'selected' : ''}>${t(o)}</option>`).join('') + `</select>`;
      else if (f.type === 'textarea') ctrl = `<textarea id="f_${f.k}" name="${f.k}" ${f.ac ? `autocomplete="${f.ac}"` : ''}>${esc(v)}</textarea>`;
      else ctrl = `<input id="f_${f.k}" name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" ${f.inputmode ? `inputmode="${f.inputmode}"` : ''} ${f.ac ? `autocomplete="${f.ac}"` : ''} ${f.type === 'number' ? 'min="0" step="10"' : ''}>`;
      html += `<div class="field ${err ? 'invalid' : ''}"><label for="f_${f.k}" class="${req ? 'req' : ''}">${lbl(f.k)}</label>${ctrl}`;
    }
    if (f.hint && !err) html += `<div class="hint">${t(f.hint)}</div>`;
    if (err) html += `<div class="error">${t(err)}</div>`;
    html += `</div>`;
  });
  if (S.step === 1) html += `<input class="hp" tabindex="-1" autocomplete="off" name="website" aria-hidden="true">`;
  return html;
}

function stepSelfie(){
  const f = S.files.selfie;
  return `<div class="selfie">
    <div class="face">${f ? `<img src="${f.preview}" alt="">` : PERSON}</div>
    <p class="hint" style="margin:0">${t('selfieHelp')}</p>
    <label class="btn ${f ? 'ghost' : 'primary'} small" style="position:relative;flex:none">
      ${f ? t('retake') : t('openCamera')}
      <input type="file" accept="image/*" capture="user" data-file="selfie" style="position:absolute;inset:0;opacity:0">
    </label>
    ${S.errors.selfie ? `<p class="error">${t(S.errors.selfie)}</p>` : ''}
  </div>`;
}

function stepDocs(){
  return `<p class="hint" style="margin-top:-6px">${t('docsHint')}</p><div class="docs">` + DOCS.map(d => {
    const f = S.files[d.k];
    const off = d.k === 'payslip' && S.data.noPrevJob;
    const opt = d.k === 'payslip' && isFreelance();
    const err = S.errors[d.k];
    return `<label class="doc ${d.wide ? 'wide' : ''} ${f ? 'has' : ''} ${err ? 'invalid' : ''} ${off ? 'off' : ''}">
      ${f && f.preview ? `<img src="${f.preview}" alt="">` : ''}
      <span class="t ${off || opt ? '' : 'req'}">${opt && !off ? t('payslipOpt') : t(d.k)}</span>
      <span class="s">${off ? t('payslipOff') : err ? `<span style="color:var(--err)">${t(err)}</span>` : f ? (f.mime === 'application/pdf' ? esc(f.name) + ' · ' : '') + t('uploaded') : t('tapUpload')}</span>
      ${off ? '' : `<input type="file" accept="${d.accept}" data-file="${d.k}">`}
    </label>`;
  }).join('') + `</div>`;
}

function stepReview(){
  const job = (S.jobs || []).find(j => j.id === S.data.jobId) || {};
  const jobName = job[S.lang] || job.en || job.zh || '';
  const optText = (k, v) => Array.isArray(v) ? v.map(t).join(', ') : ['gender','transport','source'].includes(k) && v ? t(v) : v;
  const fw = (S.data.freelanceTasks || []).map(k => k === 'fw_other' ? t(k) + '：' + (S.data.freelanceOther || '') : t(k)).join(', ');
  const rows = [['position', jobName], ['fwLabel', isFreelance() ? fw : ''], ['availLabel', isFreelance() ? availText(S.lang) : ''], ...['name','ic','phone','email','gender','area','languages','transport','expectedSalary','startDate'].map(k => [k, optText(k, S.data[k])])];
  if (!S.data.noPrevJob) rows.push(['prevCompany', S.data.prevCompany], ['prevPosition', S.data.prevPosition]);
  rows.push(['files', T.filesCount[S.lang](Object.keys(S.files).length)]);
  return `<dl class="review">` + rows.filter(r => r[1]).map(([k, v]) => `<dt>${lbl(k).replace(/（.*?）|\(.*?\)/g, '')}</dt><dd>${esc(v)}</dd>`).join('') + `</dl>
    <label class="toggle consent ${S.errors.consent ? 'invalid' : ''}" style="align-items:flex-start;font-weight:600">
      <input type="checkbox" id="consent" ${S.consent ? 'checked' : ''} style="margin-top:2px;flex:none"> <span>${t('consent')}</span>
    </label>
    ${S.errors.consent ? `<p class="error">${t('needConsent')}</p>` : ''}`;
}

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll('.avail button').forEach(b => b.onclick = () => {
    const a = S.data.avail = S.data.avail || [];
    const k = b.dataset.slot, i = a.indexOf(k);
    if (i >= 0) a.splice(i, 1); else a.push(k);
    b.setAttribute('aria-pressed', i < 0); b.textContent = i < 0 ? '✓' : '';
    if (S.errors.avail && a.length) { delete S.errors.avail; render(); }
  });
  document.querySelectorAll('.job').forEach(b => b.onclick = () => {
    S.data.jobId = b.dataset.job; delete S.errors.jobId; render();
  });
  document.querySelectorAll('#card input:not([type=file]), #card select, #card textarea').forEach(el => {
    if (el.id === 'noPrevJob') { el.onchange = () => { S.data.noPrevJob = el.checked; S.errors = {}; render(); }; return; }
    if (el.id === 'consent') { el.onchange = () => { S.consent = el.checked; delete S.errors.consent; }; return; }
    const h = () => {
      if (el.name === 'freelanceTasks') { S.data.freelanceTasks = [...document.querySelectorAll('input[name="freelanceTasks"]:checked')].map(x => x.value); delete S.errors.freelanceTasks; render(); return; }
      if (el.type === 'checkbox') S.data[el.name] = [...document.querySelectorAll(`input[name="${el.name}"]:checked`)].map(x => x.value);
      else if (el.type === 'radio') { if (el.checked) S.data[el.name] = el.value; }
      else S.data[el.name] = el.value;
    };
    el.addEventListener('input', h); el.addEventListener('change', h);
  });
  document.querySelectorAll('input[type=file]').forEach(el => el.onchange = async () => {
    const file = el.files[0]; if (!file) return;
    const k = el.dataset.file;
    try {
      S.files[k] = await readFile(file);
      delete S.errors[k];
    } catch (e) { S.errors[k] = e.message in T ? e.message : 'readFail'; }
    render();
  });
}

async function readFile(file){
  const type = file.type || '';
  if (type === 'application/pdf') {
    if (file.size > 8e6) throw new Error('tooBig');
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    return { data: url.split(',')[1], mime: 'application/pdf', name: file.name, preview: null };
  }
  if (type && !type.startsWith('image/')) throw new Error('badType');
  const url = await compressImage(file);
  return { data: url.split(',')[1], mime: 'image/jpeg', name: file.name, preview: url };
}

async function compressImage(file, max = 1600, q = 0.82){
  const src = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('readFail')); i.src = src; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(src); }
}

/* ---------- validation ---------- */
function validate(){
  const e = {};
  const d = S.data;
  if (S.step === 0 && !d.jobId) e.jobId = 'pickJob';
  if (S.step === 0 && isFreelance()) {
    const ft = d.freelanceTasks || [];
    if (!ft.length) e.freelanceTasks = 'needFw';
    else if (ft.includes('fw_other') && !String(d.freelanceOther || '').trim()) e.freelanceOther = 'required';
    if (!(d.avail || []).length) e.avail = 'needAvail';
  }
  if (S.step === 1 || S.step === 2) {
    FIELDS[S.step].forEach(f => {
      if (S.step === 2 && d.noPrevJob && (f.req === 'job' || f.jobOnly)) return;
      const req = f.req === 1 || (f.req === 'job' && !d.noPrevJob);
      const v = d[f.k];
      const empty = Array.isArray(v) ? !v.length : !String(v ?? '').trim();
      if (req && empty) { e[f.k] = 'required'; return; }
      if (empty) return;
      if (f.check === 'ic' && String(v).replace(/\D/g, '').length !== 12) e[f.k] = 'badIc';
      if (f.check === 'phone' && !/^(\+?6?0)1\d{7,9}$/.test(String(v).replace(/[\s-]/g, ''))) e[f.k] = 'badPhone';
      if (f.check === 'email' && !/^\S+@\S+\.\S+$/.test(v)) e[f.k] = 'badEmail';
    });
  }
  if (S.step === 3 && !S.files.selfie) e.selfie = 'needSelfie';
  if (S.step === 4) DOCS.forEach(x => {
    if (x.k === 'payslip' && (d.noPrevJob || isFreelance())) return;
    if (!S.files[x.k]) e[x.k] = 'needFile';
  });
  if (S.step === 5 && !S.consent) e.consent = 'needConsent';
  S.errors = e;
  return !Object.keys(e).length;
}

/* ---------- navigation ---------- */
$('nextBtn').onclick = async () => {
  if (!validate()) {
    render();
    const first = document.querySelector('.invalid, .error');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (S.step === 5) return submit();
  S.step++; render(S.step - 1); window.scrollTo(0, 0);
};
$('backBtn').onclick = () => { S.errors = {}; S.step--; render(); window.scrollTo(0, 0); };

/* ---------- submit ---------- */
async function submit(){
  const d = S.data;
  const zh = k => T[k] ? T[k].zh : k;               // Sheet 一律存中文選項
  const job = S.jobs.find(j => j.id === d.jobId);
  const hp = document.querySelector('input[name=website]');
  const data = {
    jobId: d.jobId, jobTitle: job ? (job.zh || job.en) : '',
    name: (d.name || '').trim(), ic: (d.ic || '').trim(), phone: (d.phone || '').trim(), email: (d.email || '').trim(),
    gender: zh(d.gender), area: d.area || '', address: d.address || '',
    languages: (d.languages || []).map(zh).join(', '), transport: zh(d.transport),
    expectedSalary: d.expectedSalary ? d.expectedSalary + (isFreelance() ? '/天' : '') : '', startDate: d.startDate || '', source: d.source ? zh(d.source) : '',
    noPrevJob: d.noPrevJob ? '是' : '',
    prevCompany: d.noPrevJob ? '' : (d.prevCompany || ''), prevPosition: d.noPrevJob ? '' : (d.prevPosition || ''),
    prevDuration: d.noPrevJob ? '' : (d.prevDuration || ''), leaveReason: d.noPrevJob ? '' : (d.leaveReason || ''),
    freelanceWork: isFreelance() ? (d.freelanceTasks || []).map(k => k === 'fw_other' ? '其他：' + (d.freelanceOther || '').trim() : zh(k)).join(', ') : '',
    availability: isFreelance() ? availText('zh') : '',
    experience: d.experience || '', lang: S.lang.toUpperCase(), website: d.website || (hp ? hp.value : '')
  };
  const files = {};
  Object.entries(S.files).forEach(([k, f]) => { if (k === 'payslip' && d.noPrevJob) return; files[k] = { data: f.data, mime: f.mime }; });

  $('overlayText').textContent = t('uploading');
  $('overlay').classList.add('on');
  $('nextBtn').disabled = true;
  try {
    const r = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'submit', data, files }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Unknown error');
    showDone(j.id);
  } catch (err) {
    alert(t('submitFail') + err.message + '\n' + t('tryAgain'));
  } finally {
    $('overlay').classList.remove('on');
    $('nextBtn').disabled = false;
  }
}

function showDone(id){
  $('app').hidden = true; $('nav').hidden = true;
  $('doneView').hidden = false;
  $('doneView').innerHTML = `<div class="trail" style="justify-content:center">${FOOT.repeat(6).replace(/<svg/g, '<svg class="done"')}</div>
    <h2>${t('doneTitle')}</h2><div class="hint">${t('doneRef')}</div><div class="ref">${esc(id)}</div><p>${t('doneText')}</p>`;
  window.scrollTo(0, 0);
}

/* ---------- boot ---------- */
initLang();
render();
fetch(GAS_URL + '?action=jobs').then(r => r.json()).then(j => {
  S.jobs = j.jobs || [];
  const pre = new URLSearchParams(location.search).get('job');   // QR 可帶 ?job=ID 預選職位
  if (pre && S.jobs.some(x => x.id === pre)) S.data.jobId = pre;
  render();
}).catch(() => { S.jobsErr = true; render(); });
</script>
